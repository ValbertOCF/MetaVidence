<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MetaVidence</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<style>
  :root {
    --ink: #0d1726; --text: #2b3a51; --muted: #5b6a83;
    --blue-600: #1769e0; --blue-500: #2b8cff; --cyan: #5bd1ff;
    --line: #e7eaf0; --line-strong: #d6dce6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 24px;
    background-color: #f7f8fa;
    background-image: linear-gradient(180deg, #eef2f7 0%, #f7f8fa 320px);
    color: var(--text);
    font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .card { width: 100%; max-width: 520px; text-align: center; }
  .brand {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin-bottom: 28px;
  }
  .brand svg { width: 46px; height: 46px; display: block;
               filter: drop-shadow(0 8px 18px rgba(23,105,224,.32)); }
  .name {
    font-family: Manrope, Inter, 'Segoe UI', sans-serif;
    font-size: 1.7rem; font-weight: 800; color: var(--ink);
    letter-spacing: -.01em;
  }
  .name span { color: var(--blue-600); }
  h1 {
    font-family: Manrope, Inter, 'Segoe UI', sans-serif;
    font-size: 1.3rem; font-weight: 800; color: var(--ink);
    margin: 0 0 6px; letter-spacing: -.02em;
  }
  p { margin: 0 0 26px; color: var(--muted); font-size: .97rem; }
  .langs { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.lang {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 26px; border: 1px solid var(--line-strong);
    border-radius: 999px; background: #fff; color: var(--ink);
    font-family: Manrope, Inter, sans-serif; font-weight: 700;
    text-decoration: none;
    box-shadow: 0 1px 2px rgba(16,30,54,.04), 0 8px 24px rgba(16,30,54,.05);
    transition: transform 160ms ease, border-color 160ms ease, color 160ms ease;
  }
  a.lang:hover, a.lang:focus {
    transform: translateY(-2px); border-color: rgba(43,140,255,.55);
    color: var(--blue-600); outline: none;
  }
  a.lang span { color: var(--blue-600); }
  .back { margin-top: 26px; font-size: .87rem; }
  .back a { color: var(--blue-600); }
  @media (max-width: 420px) { .langs { flex-direction: column; } }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="mv-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1769e0"/><stop offset="1" stop-color="#5bd1ff"/></linearGradient></defs><rect x="2" y="2" width="44" height="44" rx="13" fill="url(#mv-g)"/><path d="M24 10v28" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/><path d="M12 16h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="19" cy="16" r="3" fill="#fff"/><path d="M18 24h18" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="29" cy="24" r="3" fill="#fff"/><path d="M17 34l7-5 7 5-7 5z" fill="#fff"/></svg>
      <span class="name">Meta<span>Vidence</span></span>
    </div>

    <h1>Tutoriais / Tutorials</h1>
    <p>Escolha o idioma. Choose your language.</p>

    <div class="langs">
      <a class="lang" href="pt/">Português <span>&rarr;</span></a>
      <a class="lang" href="en/">English <span>&rarr;</span></a>
    </div>

    <p class="back"><a href="../">Voltar ao MetaVidence / Back to MetaVidence</a></p>
  </div>

<script>
  /* Sends the visitor straight to their browser language, but only on the
     first visit: anyone who picked a language by hand must not be thrown back
     to it on every return. */
  (function () {
    try {
      if (sessionStorage.getItem('mv-lang-visto')) return;
      sessionStorage.setItem('mv-lang-visto', '1');
      var l = (navigator.language || '').toLowerCase();
      location.replace(l.indexOf('pt') === 0 ? 'pt/' : 'en/');
    } catch (e) { /* sem sessionStorage: fica na pagina de escolha */ }
  })();
</script>
</body>
</html>
